<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>
  if (location.hostname === 'duathcys.github.io') {
    location.replace('https://traders-psi.vercel.app/preview.html' + location.search + location.hash);
  }
</script>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRADERS - iPhone Preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:linear-gradient(135deg,#e6ece9,#f7f9f8);font-family:-apple-system,"Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden}
/* iPhone 15/16 : 화면 393 x 852 (19.5:9), 베젤 12px */
.phone{--bz:12px;width:calc(393px + var(--bz)*2);height:calc(852px + var(--bz)*2);padding:var(--bz);background:#111;border-radius:67px;box-shadow:0 0 0 2px #3a3b3e,0 0 0 5px #1a1a1c,0 40px 80px -20px rgba(0,0,0,.45);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(var(--s,1))}
.screen{position:relative;width:393px;height:852px;border-radius:55px;overflow:hidden;background:#fff}
iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.island{position:absolute;z-index:3;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;pointer-events:none}
.status{position:absolute;z-index:2;top:0;left:0;right:0;height:54px;padding:18px 34px 0;display:flex;justify-content:space-between;font-size:15px;font-weight:600;pointer-events:none;color:#111;background:rgba(255,255,255,.94);backdrop-filter:blur(10px)}
.status span:last-child{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;z-index:3;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;pointer-events:none}
.btn{position:absolute;width:3px;background:#2a2b2e;border-radius:2px}
.b1{left:-5px;top:140px;height:32px}.b2{left:-5px;top:200px;height:60px}.b3{left:-5px;top:276px;height:60px}.b4{right:-5px;top:230px;height:96px}
/* 실제 폰에서 열면 프레임 없이 전체 화면 */
@media (max-width:520px){
    .phone{position:static;width:100%;height:100vh;height:100dvh;padding:0;border-radius:0;box-shadow:none;transform:none;background:#fff}
  .screen{width:100%;height:100%;border-radius:0}
  .island,.status,.homebar,.btn{display:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <i class="btn b1"></i><i class="btn b2"></i><i class="btn b3"></i><i class="btn b4"></i>
    <div class="screen">
      <div class="status"><span>9:41</span>
        <span><svg width="18" height="12" viewBox="0 0 18 12" fill="#111"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="#111" opacity=".4"/><rect x="2" y="2" width="19" height="8" rx="2.2" fill="#111"/><rect x="24" y="4" width="1.6" height="4" rx=".8" fill="#111" opacity=".5"/></svg></span></div>
      <div class="island"></div>
      <iframe id="app" title="TRADERS 웹앱" allow="fullscreen"></iframe>
      <div class="homebar"></div>
    </div>
  </div>
</div>
<script>
const mobile = innerWidth <= 520;
/* 같은 폴더의 index.html을 불러옵니다. 다른 주소를 쓰려면 아래 경로만 바꾸세요. */
document.getElementById('app').src = './index.html' + (mobile ? '?v=20261020-latest-round-scope' : '?frame=1&v=20261020-latest-round-scope');
function fit(){
  if(mobile) return;
  const s = Math.min(1, (innerHeight - 32) / (852 + 24), (innerWidth - 32) / (393 + 24));
  document.getElementById('phone').style.setProperty('--s', s);
}
fit(); addEventListener('resize', fit);
</script>
</body>
</html>
