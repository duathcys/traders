<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRADERS - 트레더 (TRA:TOGETHER)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="phone">

  <!-- 0. 트레이더스 홈 (기존 디자인 유지) -->
  <section class="screen active" id="s-home">
    <header class="top">
      <button class="icon-btn" aria-label="알림">🔔</button>
      <div class="logo">TRADERS <span class="chev">⌄</span></div>
      <button class="icon-btn" aria-label="메뉴">☰</button>
    </header>
    <div class="search"><input value="레드와인" aria-label="검색"><span>🔍</span></div>
    <p class="login"><u>로그인하고</u> <b>혜택 받기</b></p>

    <div class="banner">
      <div class="b-txt">
        <h4>FOOD FESTIVAL</h4>
        <h2>한우 리테일팩<br>전품목<small>(냉장/각)</small></h2>
        <p>트레이더스에서 만나보세요<br>10.19(월) – 10.25(일)</p>
      </div>
      <div class="bubble">신세계포인트 적립 시<br><b>4,000원 할인</b></div>
      <div class="meat">🥩</div>
      <div class="pager">1/7 <span>❚❚</span></div>
    </div>

    <button class="club">TRADERS CLUB 혜택 받기 <span>›</span></button>

    <nav class="quick" id="quick">
      <a href="#"><i>🏷️</i>금주의전단</a>
      <a href="#"><i class="n">🛍️</i>오더픽</a>
      <a href="#" id="go-tra" class="tra"><i>🤝<em>NEW</em></i>트레더</a>
      <a href="#"><i>🚚</i>오더투홈</a>
      <a href="#"><i>🍷</i>와인그랩</a>
      <a href="#"><i>📱</i>디지털그랩</a>
    </nav>

    <div class="gap"></div>
    <div class="story-head"><h3>에디터와 함께 나누는 트레이더스 이야기</h3><u>전체보기</u></div>
    <div class="story">
      <div class="thumb">🥗</div>
      <div><b>10월 제철음식 무화과 즐기기! 과일 샐러드 요리 레시피</b>
      <p>안녕하세요. 10월부터 새로 인사드리는 트레이더스 에디터 소금볔입니다 가...</p></div>
    </div>

    <footer class="tab">
      <a>🧾<span>영수증</span></a><a>🎟️<span>쿠폰</span></a>
      <a class="pay"><i>이마트페이</i></a>
      <a>🙂<span>마이</span></a><a class="shop"><i>쇼핑모드</i></a>
    </footer>
  </section>

  <!-- 렌더링 영역: 트레더 1~5단계는 app.js가 채웁니다 -->
  <section class="screen" id="s-share"></section>
</div>
<script src="app.js"></script>
</body>
</html>
